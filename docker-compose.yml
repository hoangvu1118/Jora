name: jora
services:               # The list of container
  postgres:             # a name to choose for this container --> internal name (Docker DNS) / Service Name
    image: postgres:17  # what to run, downloaded from Docker Hub
    container_name: jora-db # The name for Container itself -> See when check "docker ps"
    environment:        # Setting for the container
      POSTGRES_DB: sefujo
      POSTGRES_USER: hvu
      POSTGRES_PASSWORD: 11182005
    ports:
      - "5432:5432"     # "your laptop port : container port"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: jora-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1                                                    # Broker ID
      KAFKA_PROCESS_ROLES: broker, controller                             # Kraft Mode: Can be 1 or both role
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093               # The door open inside the container: 9092 -> Client, 9093 -> Controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092         # The door kafka tell clients to connect back
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER                         # Says which door is the controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT  # Both doors use plain, unencrypted traffic. Fine for local work.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093                    # The list of controllers that vote. Here it is only node 1.

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                           # Kafka's internal topics default to 3 copies.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1                   # You have one broker, so they must be 1, or consumer groups fail to start.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: jora-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  redis:
    image: redis:7.4
    container_name: jora-redis
    ports:
      - "6379:6379"

  jora:
    build: .
    container_name: jora-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sefujo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    depends_on:
      - postgres
      - kafka
      - redis
    restart: on-failure # try again if postgres wasnot ready yet

volumes:
  postgres_data:
    name: jora_postgres_data       # declare the named volume used above